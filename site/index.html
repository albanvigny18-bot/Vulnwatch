<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>VulnWatch — Veille des vulnérabilités en clair</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#fff;--surface2:#f8fafc;--ink:#0b1324;--ink2:#334155;--mute:#64748b;--line:#e3e8f0;
  --brand:#2563eb;--brandsoft:#e8efff;
  --p1:#d92d20;--p1s:#fdecea;--p2:#f97316;--p2s:#fff1e6;--p3:#ca8a04;--p3s:#fef7dc;--p4:#64748b;--p4s:#eef2f6;
  --ok:#16a34a;--oks:#e9f8ef;--kev:#7a1414;--msf:#6d28d9;--parc:#1d4ed8;
  --r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070d1a;--surface:#0f172a;--surface2:#131d33;--ink:#e8edf6;--ink2:#cbd5e1;--mute:#94a3b8;--line:#1e293b;
  --brandsoft:#16244a;--p1s:#3a1210;--p2s:#3a1f0c;--p3s:#33290a;--p4s:#1c2536;--oks:#0f2b1a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand)}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
.topin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:750;font-size:18px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.logo svg{width:28px;height:28px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--p2)}
.sp{flex:1}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh);font-weight:600}
.tabs{max-width:1120px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-size:14px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--brandsoft);color:var(--brand);font-weight:650}
.bnav{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .pill{display:none}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
  .bnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mute);padding:4px 0;cursor:pointer}
  .bnav button svg{width:24px;height:24px}
  .bnav button.on{color:var(--brand);font-weight:650}
  main{padding-bottom:calc(env(safe-area-inset-bottom) + 84px)!important}
  footer{padding-bottom:calc(env(safe-area-inset-bottom) + 90px)!important}
}
main{max-width:1120px;margin:0 auto;padding:16px}
h1{font-size:26px;letter-spacing:-.02em;margin:4px 0 2px}
h2{font-size:18px;letter-spacing:-.01em;margin:22px 0 10px}
.lead{color:var(--mute);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.hero{border-radius:20px;padding:20px;color:#fff;background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);box-shadow:var(--sh)}
.hero.alert{background:linear-gradient(135deg,#7f1d1d,#d92d20 60%,#f97316)}
.hero.calm{background:linear-gradient(135deg,#14532d,#16a34a 65%,#22c55e)}
.hero small{opacity:.85;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.hero .big{font-size:30px;font-weight:780;letter-spacing:-.02em;line-height:1.15;margin:6px 0}
.hero p{margin:0;opacity:.95;max-width:720px}
.hero .cta{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--sh);transition:transform .12s}
.kpi:active{transform:scale(.98)}
.kpi b{display:block;font-size:26px;font-weight:780;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--mute)}
.kpi.p1 b{color:var(--p1)}.kpi.p2 b{color:var(--p2)}.kpi.kev b{color:var(--kev)}.kpi.parc b{color:var(--parc)}
@media (prefers-color-scheme:dark){.kpi.kev b{color:#f87171}}
.syn p{margin:0 0 10px;font-size:15.5px;line-height:1.6;color:var(--ink2)}.syn p:last-child{margin:0}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.list{display:grid;gap:10px}
.v{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--p4);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;cursor:pointer}
.v.P1{border-left-color:var(--p1)}.v.P2{border-left-color:var(--p2)}.v.P3{border-left-color:var(--p3)}
.vh{display:flex;align-items:flex-start;gap:10px}
.vt{flex:1;min-width:0}
.vt h3{margin:0;font-size:16px;letter-spacing:-.01em;line-height:1.3}
.vid{font-size:12.5px;color:var(--mute);margin-top:2px}
.vid a{color:var(--mute)}
.prio{flex:none;font-size:12px;font-weight:750;border-radius:8px;padding:3px 8px;color:#fff;background:var(--p4);white-space:nowrap}
.prio.P1{background:var(--p1)}.prio.P2{background:var(--p2)}.prio.P3{background:var(--p3)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.t{font-size:11.5px;font-weight:650;border-radius:7px;padding:2px 8px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.t.crit{background:var(--p1s);color:var(--p1);border-color:transparent}.t.high{background:var(--p2s);color:var(--p2);border-color:transparent}
.t.kev{background:var(--kev);color:#fff;border-color:transparent}.t.msf{background:var(--msf);color:#fff;border-color:transparent}
.t.parc{background:var(--parc);color:#fff;border-color:transparent}.t.new{background:#0891b2;color:#fff;border-color:transparent}
.t.ok{background:var(--oks);color:var(--ok);border-color:transparent}
.plain{margin:10px 0 0;color:var(--ink2);font-size:14.5px}
.todo{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.v.P1 .todo{background:var(--p1s);border-color:transparent}.v.P2 .todo{background:var(--p2s);border-color:transparent}
.todo b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:2px}
.det{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.v.open .det{display:block}
.kv{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:6px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.more{font-size:12.5px;color:var(--mute);margin-top:8px}
.search{display:flex;gap:8px;margin:4px 0 10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.count{color:var(--mute);font-size:13px}
.views{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vw{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;box-shadow:var(--sh)}
.vw h4{margin:0 0 3px;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.vw h4 span{color:var(--mute);font-weight:600;white-space:nowrap}.vw h4 span.r{color:var(--p1)}
.vw p{margin:0;color:var(--mute);font-size:13px}
.help{display:none;font-size:13.5px;line-height:2}.help.on{display:block}
.mono{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.empty{text-align:center;color:var(--mute);padding:36px 16px}
.empty .ico{font-size:40px}
.form{display:grid;gap:10px}
.f label{display:block;font-weight:650;font-size:14px}.f small{display:block;color:var(--mute);margin:2px 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);margin-top:3px}
textarea.in{font:13px ui-monospace,Menlo,monospace;min-height:130px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 .full{grid-column:1/-1}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.asset .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.asset label{font-size:12.5px;color:var(--mute)}
.note{font-size:13.5px;color:var(--ink2);background:var(--brandsoft);border-radius:12px;padding:10px 12px;margin:10px 0}
.status{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.okk{color:var(--ok);font-weight:800}.nok{color:var(--mute)}
.gl dt{font-weight:700;margin-top:12px}.gl dt:first-child{margin-top:0}.gl dd{margin:3px 0 0;color:var(--ink2)}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 52px;position:relative;box-shadow:var(--sh)}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.sheet{display:grid;gap:8px}
.sheet button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--sh)}
.sheet button span.s{color:var(--mute);font-size:13px;display:block}
footer{max-width:1120px;margin:20px auto 0;padding:0 16px 28px;color:var(--mute);font-size:12px;text-align:center}
.health{font-size:12px;color:var(--mute)}.bad{color:var(--p1);font-weight:650}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>

<script>
(function(){
'use strict';
var D=null, view='home', sub='', simple=true, PARC=[], q='', qShown=40, parcShown=40, curRows=[], EDIT={};
var $=function(id){return document.getElementById(id)};
var app=$('app');
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
try{simple=store('vw-mode')!=='expert';PARC=JSON.parse(store('vw-parc')||'[]')||[]}catch(e){PARC=[]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function nrm(s){return ' '+norm(s).replace(/[^a-z0-9]+/g,' ').trim()+' '}
function fmt(iso){if(!iso)return'';var d=new Date(iso);return isNaN(d)?iso:d.toLocaleString('fr-CA',{dateStyle:'medium',timeStyle:'short'})}
function fdate(iso){if(!iso)return'';var d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString('fr-CA',{dateStyle:'medium'})}
function pct(x){return x==null?'—':(x*100).toFixed(x<0.1?1:0)+' %'}
function ago(iso){var m=(Date.now()-new Date(iso))/60000;if(m<60)return Math.max(1,Math.round(m))+' min';if(m<1440)return Math.round(m/60)+' h';return Math.round(m/1440)+' j'}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function copyText(t){var done=function(){toast('Copié ✓')};var fb=function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}
function download(name,text){var blob=new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
var PO={P1:0,P2:1,P3:2,P4:3};
var PLABEL={P1:'Urgent — sous 48 h',P2:'Important — cette semaine',P3:'À planifier — dans le mois',P4:'À surveiller'};
function byPrio(a,b){return (PO[a.priority]-PO[b.priority])||((b.risk||0)-(a.risk||0))}

/* ---------- nom lisible ---------- */
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function prodName(r){
  if(r.affected)return r.affected.split(';')[0].trim();
  var v=r.vendor||'',p=r.product||'';
  if(v&&p&&norm(p).indexOf(norm(v))===0)v='';
  return [cap(v),cap(p)].filter(Boolean).join(' ')||(r.packages?r.packages.split(',')[0]:'Logiciel non précisé');
}
function fallbackPlain(r){
  var s=r.score, g=s==null?'Gravité pas encore évaluée.':'Gravité '+(s>=9?'très élevée':s>=7?'élevée':s>=4?'moyenne':'faible')+' ('+s.toFixed(1)+'/10).';
  var t=(r.kev||r.ssvc_exploitation==='Active')?' ⚠️ Des pirates l\'utilisent déjà.':(r.msf?' Un outil d\'attaque public existe.':' Aucune attaque connue à ce jour.');
  return 'Une faille dans '+prodName(r)+'. '+g+t;
}
function fallbackTodo(p,r){
  var fix=r.pkg_fixed?'mettre à jour vers la version '+r.pkg_fixed+' ou plus récente':(r.ref_patch||r.patch_available==='Oui')?'installer la mise à jour de sécurité de l\'éditeur':'appliquer les recommandations de l\'éditeur dès leur publication';
  return {P1:'URGENT — sous 48 h : '+fix+'. Si c\'est impossible, isoler l\'équipement ou couper son accès depuis Internet.',
          P2:'IMPORTANT — cette semaine : '+fix+'.',P3:'À planifier — sous 30 jours : '+fix+'.',P4:'Pas d\'action immédiate : rester informé.'}[p];
}
/* ---------- priorité personnalisée (mêmes règles que le moteur) ---------- */
function prioFor(r,a){

    var rows=runQ(D.vulns,'vue:"'+v.name+'"'),p1=rows.filter(function(r){return r.priority==='P1'}).length;
    return '<div class="vw" data-q=\'vue:"'+esc(v.name)+'"\'><h4>'+esc(v.name)+'<span class="'+(p1?'r':'')+'">'+rows.length+(p1?' · '+p1+' P1':'')+'</span></h4><p>'+esc(v.desc)+'</p></div>'}).join('')+'</div>';
};
S.kev=function(){
  return '<h1>Failles exploitées</h1><p class="lead">L\'agence américaine de cybersécurité (CISA) tient la liste officielle des failles <b>déjà utilisées par des pirates</b>. Voici les ajouts récents.</p><div class="list">'+
    D.kev.slice(0,150).map(function(k){return '<article class="v P1" style="cursor:default"><div class="vh"><div class="vt"><h3>'+esc(k.vendorProject+' '+k.product)+'</h3><div class="vid"><a target="_blank" rel="noopener" href="https://nvd.nist.gov/vuln/detail/'+esc(k.cveID)+'">'+esc(k.cveID)+'</a> · ajoutée le '+esc(k.dateAdded)+'</div></div><span class="prio P1">Exploitée</span></div>'+
      (k.knownRansomwareCampaignUse==='Known'?'<div class="tags"><span class="t kev">Utilisée par des rançongiciels</span></div>':'')+
      '<p class="plain"><b>'+esc(k.vulnerabilityName)+'.</b> '+esc(k.shortDescription)+'</p><div class="todo"><b>À corriger avant le '+esc(k.dueDate)+'</b>'+esc(k.requiredAction)+'</div></article>'}).join('')+'</div>';
};
S.alerts=function(){
  return '<h1>Alertes envoyées</h1><p class="lead">Les alertes émises par cette installation de VulnWatch.</p><div class="list">'+(D.alerts.length?D.alerts.slice(0,200).map(function(a){
    return '<div class="card" style="padding:12px 14px"><b>'+esc(a.cve)+'</b> <span class="prio '+(a.priority>=5?'P1':'P2')+'" style="font-size:11px">'+(a.priority>=5?'Urgent':'Important')+'</span><div style="margin-top:4px">'+esc(a.reasons)+'</div><div class="count">'+esc(fmt(a.date))+' · '+esc(a.channels)+'</div></div>'}).join(''):'<div class="empty">Aucune alerte pour le moment.</div>')+'</div>';
};
S.learn=function(){
  return '<h1>Comprendre</h1><p class="lead">Les mots de la cybersécurité, expliqués simplement.</p><div class="card"><dl class="gl">'+D.glossaire.map(function(g){return '<dt>'+esc(g.terme)+'</dt><dd>'+esc(g.def)+'</dd>'}).join('')+'</dl></div>'+
    '<h2>Comment VulnWatch décide de la priorité</h2><div class="card syn"><p><b>P1 — urgent (48 h)</b> : la faille est déjà utilisée par des pirates, OU un outil d\'attaque est public, OU elle est critique avec un risque d\'attaque élevé ou du code d\'attaque publié, OU elle est critique et touche un de tes équipements exposés.</p><p><b>P2 — important (7 jours)</b> : critique, ou très probablement attaquée bientôt, ou elle touche ton parc.</p><p><b>P3 — à planifier (30 jours)</b> : gravité élevée ou risque modéré.</p><p><b>P4 — à surveiller</b> : le reste.</p></div>';
};
S.install=function(){
  var repo=D.kpi.repo||'';
  return '<h1>Mon propre VulnWatch</h1><p class="lead">Ton installation personnelle, <b>gratuite</b>, qui tourne toute seule toutes les heures : <b>tes</b> équipements, <b>tes</b> alertes sur ton téléphone, <b>ton</b> Excel. Environ 10 minutes, faisable sur iPhone.</p>'+
    '<ol class="steps">'+
    '<li><b>Crée un compte GitHub gratuit</b> sur <a href="https://github.com/signup" target="_blank" rel="noopener">github.com</a>, si tu n\'en as pas.</li>'+
    '<li><b>Copie VulnWatch</b> : '+(repo?'<a class="btn sm pri" target="_blank" rel="noopener" href="https://github.com/'+esc(repo)+'/generate">Créer mon VulnWatch ↗</a>':'bouton « Use this template »')+'<br><span class="count">Donne un nom (ex. vulnwatch), choisis <b>Public</b>, puis « Create repository ». Ta copie est vierge : aucune donnée de quelqu\'un d\'autre.</span></li>'+
    '<li><b>Active la publication</b> : dans ta copie, Settings → Pages → Source : <b>GitHub Actions</b>.</li>'+
    '<li><b>Active les alertes sur ton téléphone</b> : installe l\'application <b>ntfy</b>, abonne-toi à un nom secret que tu inventes (ex. vulnwatch-k7q2m9x4). Puis dans GitHub : Settings → Secrets and variables → Actions → New repository secret, nom <span class="mono">NTFY_TOPIC</span>, valeur = ce nom.</li>'+
    '<li><b>Ajoute ton parc</b> : remplis l\'onglet « Mon parc », touche « Copier ma liste », puis crée le secret <span class="mono">INVENTAIRE</span> et colle.</li>'+
    '<li><b>Démarre</b> : onglet Actions → VulnWatch → Run workflow. Après 3 minutes, ton site est en ligne à <span class="mono">https://TON-NOM.github.io/vulnwatch/</span> et les alertes arrivent.</li></ol>'+
    '<div class="note">Facultatif : clé NVD gratuite (plus rapide), Excel chiffré par mot de passe, courriel quotidien avec l\'Excel joint, Teams ou Slack. Tout est expliqué dans le guide '+(repo?'<a target="_blank" rel="noopener" href="https://github.com/'+esc(repo)+'/blob/main/INSTALLER.md">INSTALLER.md</a>':'INSTALLER.md')+'.</div>';
};
var FIELDS=[['seuils','cvss_critique','num','Seuil « critique » (note sur 10)','À partir de quelle gravité une faille est critique. Standard : 9.'],
  ['seuils','epss_alerte','num','Probabilité d\'attaque qui déclenche une alerte','0.5 = 50 %.'],['seuils','cvss_min_parc','num','Gravité minimale pour alerter sur ton parc',''],
  ['alertes','failles_exploitees','bool','Alerter sur les failles exploitées',''],['alertes','failles_critiques','bool','Alerter sur les failles critiques',''],
  ['alertes','resume_horaire','bool','Résumé horaire silencieux',''],['alertes','maximum_par_passage','num','Alertes maximum par heure','Au-delà, elles sont regroupées.'],
  ['alertes','heures_calmes','txt','Heures calmes','La nuit, seules les urgences sonnent. Ex. 22-7. Vide = jamais.'],['alertes','rapport_quotidien','bool','Point quotidien',''],
  ['alertes','heure_du_rapport','num','Heure du point quotidien','De 0 à 23.'],['alertes','courriel_niveau_minimum','sel:5=Urgent seulement|4=Urgent et important|2=Tout','Par courriel, je reçois',''],
  ['historique','jours_de_cve','num','Jours d\'historique',''],['historique','jours_catalogue_cisa','num','Jours de la liste CISA',''],
  ['suivi','tickets','bool','Tickets de suivi GitHub','Un ticket par urgence, à fermer une fois corrigée.'],['suivi','priorite_des_tickets','sel:P1=Urgences (P1)|P2=P1 et P2','Tickets pour',''],
  ['affichage','fuseau_horaire','txt','Fuseau horaire','America/Toronto pour le Québec.'],['affichage','masquer_mots_cles','bool','Masquer les mots-clés sur le site public',''],
  ['sources','exploits_publics','bool','Source : exploits publics',''],['sources','analyse_cisa','bool','Source : analyse de la CISA',''],['sources','bibliotheques_open_source','bool','Source : bibliothèques open source','']];
S.settings=function(){
  var st=D.kpi.settings||{},ch=D.kpi.channels||{},repo=D.kpi.repo||'';
  var h='<h1>Réglages de cette installation</h1><p class="lead">Réservé à la personne qui gère cette installation. Pour ton propre usage, va plutôt dans <a href="#parc" data-go="parc">Mon parc</a> ou <a href="#install" data-go="install">Mon propre VulnWatch</a>.</p>';
  h+='<div class="card"><b>État de l\'installation</b><div class="status" style="margin-top:8px">'+[['ntfy','Notifications sur téléphone (ntfy)','NTFY_TOPIC'],['courriel','Courriel et rapport quotidien','SMTP_USER, SMTP_PASSWORD, MAIL_TO'],
    ['webhook','Teams / Slack / Discord','WEBHOOK_URL'],['inventaire','Inventaire secret','INVENTAIRE'],['cle_nvd','Clé NVD','NVD_API_KEY'],['excel_chiffre','Excel complet chiffré','EXCEL_PASSWORD']].map(function(c){
      return '<span class="'+(ch[c[0]]?'okk':'nok')+'">'+(ch[c[0]]?'✓':'○')+'</span><span>'+esc(c[1])+(ch[c[0]]?'':' <span class="count">— secret '+esc(c[2])+'</span>')+'</span>'}).join('')+'</div>'+
    (repo?'<p style="margin-bottom:0"><a class="btn sm" target="_blank" rel="noopener" href="https://github.com/'+esc(repo)+'/settings/secrets/actions">Ouvrir les secrets GitHub ↗</a></p>':'')+'</div>';
  h+='<h2>Générer le fichier de réglages</h2><p class="lead">Change les valeurs, touche « Générer », copie, puis colle à la place du contenu de reglages.yml.</p><div class="form">'+FIELDS.map(function(f,i){
    var v=(st[f[0]]||{})[f[1]],inp;
    if(f[2]==='bool')inp='<select class="in" id="f'+i+'"><option value="true"'+(v?' selected':'')+'>Oui</option><option value="false"'+(!v?' selected':'')+'>Non</option></select>';
    else if(f[2].indexOf('sel:')===0)inp='<select class="in" id="f'+i+'">'+f[2].slice(4).split('|').map(function(o){var kv=o.split('=');return '<option value="'+kv[0]+'"'+(String(v)===kv[0]?' selected':'')+'>'+esc(kv[1])+'</option>'}).join('')+'</select>';
    else inp='<input class="in" id="f'+i+'" '+(f[2]==='num'?'inputmode="decimal"':'')+' value="'+esc(v==null?'':v)+'">';
    return '<div class="card f"><label for="f'+i+'">'+esc(f[3])+'</label>'+(f[4]?'<small>'+esc(f[4])+'</small>':'')+inp+'</div>'}).join('')+
    '<div class="card f"><label for="fkw">Mots-clés de surveillance (publics)</label><small>Un par ligne.</small><textarea class="in" id="fkw" style="min-height:70px">'+esc((st.mots_cles||[]).join('\n'))+'</textarea></div>'+
    '<button class="btn pri" id="gen">Générer</button><textarea class="in" id="yml" readonly placeholder="Le fichier apparaîtra ici."></textarea>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cpy">Copier</button>'+(repo?'<a class="btn" target="_blank" rel="noopener" href="https://github.com/'+esc(repo)+'/edit/main/reglages.yml">Ouvrir reglages.yml ↗</a>':'')+'</div></div>';
  return h;
};
S.more=function(){
  var items=[['views','📊','Vues expertes','20 analyses prêtes à l\'emploi'],['kev','🔥','Failles exploitées (CISA)','La liste officielle des failles attaquées'],['learn','📖','Comprendre','Les mots expliqués simplement'],
    ['install','🚀','Mon propre VulnWatch','Mes alertes et mon Excel, gratuitement'],['alerts','🔔','Alertes envoyées','Historique de cette installation'],['settings','⚙️','Réglages','Pour l\'administrateur de cette installation']];
  return '<h1>Plus</h1><div class="sheet">'+items.map(function(i){return '<button data-go="'+i[0]+'"><span style="font-size:24px">'+i[1]+'</span><div><b>'+esc(i[2])+'</b><span class="s">'+esc(i[3])+'</span></div></button>'}).join('')+
    '<a class="btn" href="VulnWatch.xlsx" style="justify-content:flex-start;padding:14px">📗&nbsp; Télécharger l\'Excel complet</a></div>';
};
/* ---------- navigation ---------- */
var MORE=['views','kev','alerts','learn','settings','install','more'];
function go(target,push){
  var t=String(target);
  if(t.indexOf('q:')===0){q=t.slice(2);t='explore'}
  var parts=t.split(':');view=S[parts[0]]?parts[0]:'home';sub=parts[1]||'';qShown=40;parcShown=40;
  document.querySelectorAll('.tabs [data-go]').forEach(function(b){b.classList.toggle('on',b.dataset.go===view)});
  document.querySelectorAll('.bnav [data-go]').forEach(function(b){b.classList.toggle('on',b.dataset.go===view||(b.dataset.go==='more'&&MORE.indexOf(view)>=0))});
  render();window.scrollTo(0,0);
  if(push!==false)try{history.replaceState(null,'','#'+view+(view==='explore'&&q?'/'+encodeURIComponent(q):''))}catch(e){}
}
function render(){
  if(!D)return;
  $('mSimple').classList.toggle('on',simple);$('mExpert').classList.toggle('on',!simple);
  app.innerHTML=S[view]();
  bind();
}
function bind(){
  var m=$('more');if(m)m.onclick=function(){qShown+=60;render()};
  var pm=$('pmore');if(pm)pm.onclick=function(){parcShown+=60;render()};
  var qi=$('q');
  if(qi){var tm;qi.oninput=function(){clearTimeout(tm);tm=setTimeout(function(){q=qi.value.trim();qShown=40;var pos=qi.selectionStart;render();var n=$('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}
    try{history.replaceState(null,'','#explore'+(q?'/'+encodeURIComponent(q):''))}catch(e){}},220)};$('hb').onclick=function(){$('help').classList.toggle('on')}}
  var ex=$('exp');if(ex)ex.onclick=exportRows;
  if(view==='parc')bindParc();
  if(view==='settings')bindSettings();
}
function exportRows(){
  var cols=[['CVE','id'],['Priorité','priority'],['Produit',prodName],['En clair',function(r){return r.plain||fallbackPlain(r)}],['Que faire',function(r){return (r._mine||!r.todo)?fallbackTodo(r.priority,r):r.todo}],
    ['Gravité (sur 10)','score'],['Probabilité d\'attaque (EPSS)','epss'],['Exploitée (CISA)',function(r){return r.kev?'Oui':'Non'}],['Outil d\'attaque public',function(r){return r.msf?'Oui':''}],
    ['Mes équipements',function(r){return r._hits?r._hits.map(function(h){return h.name||h.product}).join(', '):''}],['Versions touchées','versions'],['Version corrigée','pkg_fixed'],
    ['Correctif',function(r){return r.ref_patch||''}],['Publiée','published'],['Fiche officielle',function(r){return 'https://nvd.nist.gov/vuln/detail/'+r.id}]];
  var lines=[cols.map(function(c){return c[0]}).join(';')].concat(curRows.map(function(r){return cols.map(function(c){var v=typeof c[1]==='function'?c[1](r):r[c[1]];v=v==null?'':String(v);return '"'+v.replace(/"/g,'""')+'"'}).join(';')}));
  download('vulnwatch-'+view+'.csv',lines.join('\n'));toast('Fichier prêt : ouvre-le avec Excel');
}
function saveParc(){parcCache=null;store('vw-parc',JSON.stringify(PARC))}
function bindParc(){
  var box=$('assets');
  var upd=function(e){var t=e.target;if(t.dataset.i!=null){PARC[+t.dataset.i][t.dataset.k]=t.value;saveParc()}};
  box.addEventListener('input',upd);box.addEventListener('change',upd);
  box.addEventListener('click',function(e){var b=e.target.closest('[data-del]');if(b){PARC.splice(+b.dataset.del,1);EDIT={};saveParc();render();return}
    var ed=e.target.closest('[data-edit]');if(ed){EDIT[+ed.dataset.edit]=true;render()}});
  $('addA').onclick=function(){PARC.push({name:'',vendor:'',product:'',version:'',crit:'Moyenne',exposed:'Non',owner:''});EDIT[PARC.length-1]=true;saveParc();render();
    setTimeout(function(){var l=document.querySelectorAll('.asset');if(l.length){l[l.length-1].scrollIntoView({behavior:'smooth',block:'center'});var i=l[l.length-1].querySelector('input');if(i)i.focus()}},60)};
  var sv=$('saveA');if(sv)sv.onclick=function(){EDIT={};saveParc();toast('Enregistré — résultats mis à jour');render();window.scrollTo(0,0)};
  $('impA').onclick=function(){$('impBox').style.display='block';$('impT').focus()};
  $('impGo').onclick=function(){
    var n=0;$('impT').value.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).forEach(function(l){
      var c=l.split(l.indexOf(';')>=0?';':',').map(function(x){return x.trim()});if(/^(actif|nom|asset)$/i.test(c[0]||''))return;if(!(c[1]||c[2]))return;
      PARC.push({name:c[0]||'',vendor:c[1]||'',product:c[2]||'',version:c[3]||'',crit:/haute|crit|high|élev|elev/i.test(c[4]||'')?'Haute':/bas|low|faible/i.test(c[4]||'')?'Basse':'Moyenne',
        exposed:/^(oui|yes|o|y|1|vrai|true)$/i.test(c[5]||'')?'Oui':'Non',owner:c[6]||''});n++});
    saveParc();toast(n+' équipement(s) importé(s)');render()};
  var ea=$('expA');if(ea)ea.onclick=function(){
    copyText('Actif;Fournisseur;Produit;Version;Criticite;Expose;Proprietaire\n'+PARC.filter(function(a){return a.vendor||a.product}).map(function(a){return [a.name,a.vendor,a.product,a.version,a.crit,a.exposed,a.owner].map(function(x){return String(x||'').replace(/;/g,',')}).join(';')}).join('\n'))};
}
function bindSettings(){
  $('gen').onclick=function(){
    var g={},order=['seuils','alertes','historique','sources','suivi','affichage'],st=D.kpi.settings||{};
    FIELDS.forEach(function(f,i){var v=$('f'+i).value;var y=f[2]==='bool'?v:(f[2]==='num'||f[2].indexOf('sel:')===0)?(v===''?'0':v.replace(',','.')):'"'+v.replace(/"/g,'')+'"';(g[f[0]]=g[f[0]]||[]).push('  '+f[1]+': '+y+'   # '+f[3])});
    g.sources.push('  enrichissements_par_passage: '+((st.sources||{}).enrichissements_par_passage||600));g.historique.push('  jours_premier_passage: '+((st.historique||{}).jours_premier_passage||7));
    var kw=$('fkw').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    $('yml').value='# Réglages VulnWatch — générés le '+new Date().toLocaleString('fr-CA')+'\n# ⚠️ Fichier public : jamais de mot de passe, de clé ni la liste de tes équipements.\n\n'+order.map(function(k){return k+':\n'+g[k].join('\n')}).join('\n\n')+'\n\nmots_cles:'+(kw.length?'\n'+kw.map(function(k){return '  - "'+k.replace(/"/g,'')+'"'}).join('\n'):' []')+'\n';
  };
  $('cpy').onclick=function(){copyText($('yml').value)};
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.go==='explore'&&g.closest('.tabs,.bnav'))q='';go(g.dataset.go);return}
  var tl=e.target.closest('[data-tile]');if(tl){go(tl.dataset.tile);return}
  var c=e.target.closest('[data-q]');if(c){q=c.dataset.q;go('explore');return}
  var v=e.target.closest('.v');if(v&&!e.target.closest('a,button,input,select,textarea')){v.classList.toggle('open');var mo=v.querySelector('.more');if(mo)mo.textContent=v.classList.contains('open')?'Touche pour refermer':'Touche pour voir le détail'}
});
$('mSimple').onclick=function(){simple=true;store('vw-mode','simple');render()};
$('mExpert').onclick=function(){simple=false;store('vw-mode','expert');render()};
fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){
  D=d;var k=d.kpi,old=(Date.now()-new Date(k.updated))/3600000>3;
  $('st').innerHTML='<span class="dot'+(old?' warn':'')+'"></span>'+(old?'Données de plus de 3 h':'À jour · il y a '+ago(k.updated));
  $('health').innerHTML='État des sources : '+Object.keys(k.health||{}).map(function(s){var h=k.health[s];return h.fails?'<span class="bad">'+esc(s)+' en panne</span>':esc(s)+' ✓'}).join(' · ');
  var parts=location.hash.replace(/^#/,'').split('/');if(parts[1])q=decodeURIComponent(parts[1]);
  go(parts[0]||'home',false);
}).catch(function(e){app.innerHTML='<div class="empty"><div class="ico">⚠️</div>Impossible de charger les données ('+esc(e.message)+'). Réessaie dans un instant.</div>'});
})();
</script>
