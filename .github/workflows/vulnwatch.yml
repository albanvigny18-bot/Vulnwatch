name: VulnWatch

on:
  schedule:
    - cron: "7 * * * *"        # toutes les heures (UTC), à hh:07
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Envoyer une notification de test + le rapport Excel par courriel"
        type: boolean
        default: false

permissions:
  contents: write   # sauvegarde de l'état dans la branche « data »
  issues: write     # tickets de suivi (option TICKETS)
  pages: write      # publication du tableau de bord
  id-token: write

concurrency:
  group: vulnwatch
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Récupérer l'état précédent (branche data)
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C state
            echo "État restauré : $(ls state | tr '\n' ' ')"
          else
            echo "Premier passage : aucun état précédent."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements.txt

      - run: pip install -r .github/requirements.txt pytest

      - name: Tests automatiques (bloquent la publication en cas de régression)
        run: python -m pytest -q tests

      - name: Veille des vulnérabilités
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WATCHLIST: ${{ secrets.WATCHLIST }}
          INVENTAIRE: ${{ secrets.INVENTAIRE }}
          MITIGATIONS: ${{ secrets.MITIGATIONS }}
          EXCEL_PASSWORD: ${{ secrets.EXCEL_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ vars.WEBHOOK_TYPE }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          TICKETS: ${{ vars.TICKETS }}
          TICKET_PRIORITY: ${{ vars.TICKET_PRIORITY }}
          ENRICH_MAX_PER_RUN: ${{ vars.ENRICH_MAX_PER_RUN }}
          USE_GITHUB_ADVISORIES: ${{ vars.USE_GITHUB_ADVISORIES }}
          USE_EXPLOIT_SOURCES: ${{ vars.USE_EXPLOIT_SOURCES }}
          USE_VULNRICHMENT: ${{ vars.USE_VULNRICHMENT }}
          GITHUB_TOKEN: ${{ github.token }}
          INITIAL_DAYS: ${{ vars.INITIAL_DAYS }}
          HIDE_WATCHLIST: ${{ vars.HIDE_WATCHLIST }}
          CRITICAL_SCORE: ${{ vars.CRITICAL_SCORE }}
          EPSS_ALERT: ${{ vars.EPSS_ALERT }}
          WATCHLIST_MIN_SCORE: ${{ vars.WATCHLIST_MIN_SCORE }}
          SEND_DIGEST: ${{ vars.SEND_DIGEST }}
          MAX_ALERTS_PER_RUN: ${{ vars.MAX_ALERTS_PER_RUN }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
          KEV_HISTORY_DAYS: ${{ vars.KEV_HISTORY_DAYS }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          EMAIL_MIN_PRIORITY: ${{ vars.EMAIL_MIN_PRIORITY }}
          DAILY_REPORT: ${{ vars.DAILY_REPORT }}
          DAILY_REPORT_HOUR: ${{ vars.DAILY_REPORT_HOUR }}
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python vulnwatch.py --state state --site public ${{ inputs.test_notification && '--test-notification --daily-report-now' || '' }}

      - name: Sauvegarder l'état (branche data, sans historique)
        if: always() && hashFiles('state/state.json') != ''
        run: |
          cd state
          git init -q -b data
          git config user.name "vulnwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "État VulnWatch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Vérifier les fichiers générés
        run: |
          test -f public/index.html
          test -f public/data.json
          ls -la public

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Préparer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Déploiement GitHub Pages
    needs: veille
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
